name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Update version in __init__.py
        run: |
          sed -i '' "s/__version__ = \".*\"/__version__ = \"${{ steps.version.outputs.VERSION }}\"/" src/eastlake/__init__.py

      - name: Build standalone app
        run: pyinstaller eastlake.spec --noconfirm

      - name: Build DMG
        run: |
          APP_NAME="East Lake Time Tracker"
          DMG_NAME="East-Lake-Time-Tracker-v${{ steps.version.outputs.VERSION }}.dmg"

          mkdir -p dist/dmg-staging
          cp -R "dist/$APP_NAME.app" dist/dmg-staging/
          ln -s /Applications dist/dmg-staging/Applications

          hdiutil create \
            -volname "$APP_NAME" \
            -srcfolder dist/dmg-staging \
            -ov \
            -format UDZO \
            "dist/$DMG_NAME"

          rm -rf dist/dmg-staging

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/East-Lake-Time-Tracker-v${{ steps.version.outputs.VERSION }}.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
