name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Update version in __init__.py
        run: |
          sed -i '' "s/__version__ = \".*\"/__version__ = \"${{ steps.version.outputs.VERSION }}\"/" src/eastlake/__init__.py

      - name: Build standalone app
        run: pyinstaller eastlake.spec --noconfirm

      - name: Build DMG
        run: |
          APP_NAME="East Lake Time Tracker"
          DMG_NAME="East-Lake-Time-Tracker-v${{ steps.version.outputs.VERSION }}.dmg"

          create-dmg \
            --volname "$APP_NAME" \
            --volicon "assets/icon.icns" \
            --background "assets/dmg_background.png" \
            --window-pos 200 120 \
            --window-size 835 600 \
            --icon-size 128 \
            --text-size 13 \
            --icon "$APP_NAME.app" 230 295 \
            --hide-extension "$APP_NAME.app" \
            --app-drop-link 593 295 \
            --no-internet-enable \
            --filesystem HFS+ \
            "dist/$DMG_NAME" \
            "dist/$APP_NAME.app"

      - name: Extract release notes from commit message body
        run: git log -1 --pretty=%b > RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/East-Lake-Time-Tracker-v${{ steps.version.outputs.VERSION }}.dmg
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
